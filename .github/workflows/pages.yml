# Deploy the NOVA website folder to GitHub Pages.
# Push to `main` and the site goes live at  https://YOURUSERNAME.github.io/nova/
# (When you register the .com at Cloudflare, see DEPLOY.md — add CNAME + set the domain, Pages keeps HTTPS free.)
name: Deploy NOVA site
on:
  push:
    branches: [ main ]
    paths: [ 'website/**', '.github/workflows/**' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload website as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
